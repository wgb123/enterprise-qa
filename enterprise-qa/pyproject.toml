[project]
name = "enterprise-qa"
version = "0.1.0"
description = "企业智能问答助手 - 面试笔试题 Skill 实现"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "qdrant-client>=1.12.1",
    "torch>=2.10,<2.11",
    "transformers>=5.12.1",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
full = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
