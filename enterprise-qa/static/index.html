<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能问答助手</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #fff;
    --text: #1d1d1f;
    --sub: #86868b;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --border: #e5e5ea;
    --user-bg: #4f46e5;
    --user-text: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
  }
  .sidebar {
    width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
    padding: 20px; display: flex; flex-direction: column; gap: 16px;
  }
  .sidebar h1 { font-size: 18px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .sidebar .desc { font-size: 13px; color: var(--sub); line-height: 1.6; }
  .sidebar .stats { font-size: 12px; color: var(--sub); }
  .sidebar .stats div { margin: 4px 0; display: flex; justify-content: space-between; }
  .sidebar .stats span { color: var(--text); font-weight: 500; }
  .sidebar .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .conv-panel {
    width: 260px; flex-shrink: 0; background: #fff; border-left: 1px solid var(--border);
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .conv-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .conv-new { background: none; border: 1px solid var(--border); color: var(--accent); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .conv-new:hover { background: var(--accent-light); }
  .conv-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .conv-item {
    padding: 10px 10px 8px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s; position: relative;
  }
  .conv-item:hover { background: var(--accent-light); border-color: var(--border); }
  .conv-item.active { background: var(--accent-light); border-color: var(--accent); }
  .conv-item .ci-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 20px; }
  .conv-item .ci-preview { font-size: 11px; color: var(--sub); line-height: 1.4; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .ci-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .conv-item .ci-count { font-size: 10px; color: #999; background: #f0f0f5; padding: 1px 6px; border-radius: 8px; }
  .conv-item .ci-del {
    position: absolute; top: 6px; right: 6px; opacity: 0; width: 18px; height: 18px;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 11px; transition: all 0.15s;
  }
  .conv-item:hover .ci-del { opacity: 1; }
  .conv-item .ci-del:hover { background: #fee2e2; color: #e00; }
  .sidebar .tag {
    font-size: 11px; background: var(--accent-light); color: var(--accent);
    padding: 3px 10px; border-radius: 10px;
  }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; max-width: 820px; margin: 0 auto; width: 100%; }
  .msg-group { display: flex; flex-direction: column; gap: 4px; }
  .msg-label { font-size: 11px; color: var(--sub); padding: 0 4px; font-weight: 500; }
  .msg {
    max-width: 88%; padding: 12px 16px; border-radius: 14px; line-height: 1.65;
    font-size: 14px; word-break: break-word; white-space: pre-wrap;
  }
  .msg.user { background: var(--user-bg); color: var(--user-text); align-self: flex-end; border-bottom-right-radius: 6px; }
  .msg.bot { background: var(--card); color: var(--text); align-self: flex-start; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  
  /* 思考过程 */
  .thinking-box {
    background: #fafaff; border: 1px solid #e8e8f0; border-radius: 12px;
    margin-bottom: 4px; overflow: hidden; align-self: flex-start; max-width: 88%;
  }
  .thinking-header {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px;
    cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 500;
    user-select: none;
  }
  .thinking-header .arrow { transition: transform 0.2s; font-size: 10px; }
  .thinking-header.open .arrow { transform: rotate(90deg); }
  .thinking-body { padding: 0 14px 12px; font-size: 13px; color: #555; line-height: 1.7; display: none; }
  .thinking-box.open .thinking-body { display: block; }
  
  /* 步骤追踪 */
  .trace-item {
    display: flex; align-items: flex-start; gap: 8px; padding: 5px 0;
    font-size: 12px; line-height: 1.5;
  }
  .trace-icon { width: 18px; flex-shrink: 0; text-align: center; }
  .trace-item.intent { color: #2563eb; }
  .trace-item.sql { color: #d97706; }
  .trace-item.kb { color: #059669; }
  .trace-item.skip { color: #9ca3af; }
  .trace-item.done { color: #059669; font-weight: 500; }

  /* 来源 */
  .sources {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 6px;
  }
  .sources .src-tag {
    background: #f3f4f6; padding: 2px 8px; border-radius: 6px;
    color: var(--accent); font-size: 11px;
  }

  .input-bar { padding: 12px 20px 20px; display: flex; gap: 10px; max-width: 820px; margin: 0 auto; width: 100%; }
  .input-bar .wrap {
    flex: 1; display: flex; background: #fff; border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .input-bar input {
    flex: 1; padding: 10px 16px; border: none; font-size: 14px; outline: none; background: transparent;
  }
  .input-bar button {
    padding: 10px 20px; background: var(--accent); color: #fff; border: none;
    font-size: 14px; cursor: pointer; font-weight: 500; transition: opacity 0.2s;
  }
  .input-bar button:hover { opacity: 0.9; }
  .input-bar button:disabled { opacity: 0.5; cursor: default; }

  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--sub); }
  .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text); }
  .welcome p { font-size: 14px; }
  .quick-asks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
  .quick-asks button {
    background: #fff; border: 1px solid var(--border); padding: 8px 16px;
    border-radius: 20px; font-size: 13px; cursor: pointer; color: var(--text);
    transition: all 0.2s;
  }
  .quick-asks button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .cursor { display: inline-block; width: 2px; height: 16px; background: var(--accent); animation: blink 0.8s infinite; vertical-align: text-bottom; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── 移动端导航栏 ── */
  .mobile-nav {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 0 12px; height: 52px; align-items: center; justify-content: space-between;
  }
  .mobile-nav .mn-left, .mobile-nav .mn-right { display: flex; gap: 4px; }
  .mobile-nav button {
    background: none; border: none; width: 40px; height: 40px; border-radius: 8px;
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text); transition: background 0.15s;
  }
  .mobile-nav button:hover, .mobile-nav button:active { background: var(--accent-light); }
  .mobile-nav .mn-title { font-size: 16px; font-weight: 600; }

  /* ── 移动端遮罩 ── */
  .drawer-overlay {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s;
  }
  .drawer-overlay.show { opacity: 1; }

  /* ── 移动端抽屉 ── */
  .drawer {
    display: none; position: fixed; top: 0; bottom: 0; z-index: 95;
    width: 280px; max-width: 85vw; background: #fff;
    transition: transform 0.3s ease; overflow-y: auto;
  }
  .drawer-left { left: 0; transform: translateX(-100%); }
  .drawer-right { right: 0; transform: translateX(100%); }
  .drawer.open { transform: translateX(0); }
  .drawer .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 15px; font-weight: 600;
  }
  .drawer .drawer-header button {
    background: none; border: none; width: 32px; height: 32px; border-radius: 6px;
    font-size: 18px; cursor: pointer; color: var(--sub); display: flex; align-items: center; justify-content: center;
  }
  .drawer .drawer-header button:hover { background: var(--accent-light); }
  .drawer .drawer-body { padding: 16px; }

  /* ── 响应式 ── */
  @media (max-width: 768px) {
    body { padding-top: 52px; }
    .sidebar, .conv-panel { display: none; }
    .main { max-width: 100%; }
    .chat { padding: 14px 12px; max-width: 100%; }
    .input-bar { padding: 10px 12px 16px; max-width: 100%; }
    .input-bar button { padding: 10px 14px; }
    .mobile-nav { display: flex; }
    .drawer-overlay { display: block; }
    .drawer { display: block; }
    .msg { max-width: 92%; font-size: 15px; padding: 10px 14px; }
    .quick-asks button { font-size: 12px; padding: 6px 12px; }
    .welcome h2 { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- 移动端导航栏 -->
<div class="mobile-nav">
  <div class="mn-left"><button onclick="toggleDrawer('left')" title="菜单">☰</button></div>
  <div class="mn-title">💼 企业问答</div>
  <div class="mn-right"><button onclick="toggleDrawer('right')" title="会话记录">💬</button></div>
</div>

<!-- 移动端遮罩 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawers()"></div>

<!-- 移动端左侧抽屉（项目信息） -->
<div class="drawer drawer-left" id="drawerLeft">
  <div class="drawer-header"><span>💼 企业问答</span><button onclick="closeDrawers()">✕</button></div>
  <div class="drawer-body" id="drawerLeftBody"></div>
</div>

<!-- 移动端右侧抽屉（会话记录） -->
<div class="drawer drawer-right" id="drawerRight">
  <div class="drawer-header"><span>💬 会话记录</span><button onclick="closeDrawers()">✕</button></div>
  <div class="drawer-body" id="drawerRightBody"></div>
</div>

<div class="sidebar">
  <h1>💼 企业问答</h1>
  <p class="desc">智能查询员工信息、公司制度、项目数据，支持自然语言提问。</p>
  <div class="stats">
    <div>📊 数据库 <span>5 张表</span></div>
    <div>📚 知识库 <span>8 份文档</span></div>
    <div>🔍 检索 <span>BM25 + 向量</span></div>
    <div>🧠 意图 <span>DeepSeek LLM</span></div>
  </div>
  <div class="tags">
    <span class="tag">参数化SQL</span>
    <span class="tag">Qdrant向量</span>
    <span class="tag">BGE嵌入</span>
    <span class="tag">RRF融合</span>
    <span class="tag">SSE流式</span>
  </div>

  </div>

<div class="main">
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h2>👋 想问什么？</h2>
      <p>试试下面这些问题</p>
      <div class="quick-asks">
        <button onclick="ask('张三的邮箱是多少？')">📧 张三的邮箱</button>
        <button onclick="ask('年假怎么算？')">📋 年假规则</button>
        <button onclick="ask('王五符合晋升条件吗？')">📈 晋升评估</button>
        <button onclick="ask('研发部有哪些项目？')">📊 项目查询</button>
        <button onclick="ask('迟到几次扣钱？')">⏰ 迟到扣款</button>
        <button onclick="ask('张三2月迟到几次？')">📅 考勤统计</button>
      </div>
    </div>
  </div>
  <div class="input-bar">
    <div class="wrap">
      <input id="input" type="text" placeholder="输入问题，按 Enter 发送..." onkeydown="if(event.key==='Enter')send()" autofocus>
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<!-- 右侧会话记录面板 -->
<div class="conv-panel">
  <div class="conv-header">
    <span>💬 会话记录</span>
    <button class="conv-new" onclick="newConversation()" title="新建会话">＋</button>
  </div>
  <div class="conv-list" id="convList"></div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');

function h(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function ask(q) { input.value = q; send(); }

function setLoading(on) { input.disabled = on; sendBtn.disabled = on; }

async function send() {
  const q = input.value.trim();
  if (!q) return;
  if (welcome) welcome.remove();

  // 用户消息
  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.textContent = q;
  chat.appendChild(userDiv);

  input.value = '';
  setLoading(true);

  let reasoningText = '';
  let fullAnswer = '';
  let sources = [];
  let traceSteps = [];
  let botDiv = null;
  let answerStarted = false;

  // 机器人消息容器
  botDiv = document.createElement('div');
  botDiv.className = 'msg bot';
  botDiv.innerHTML = '<span class="cursor"></span>';
  chat.appendChild(botDiv);
  chat.scrollTop = chat.scrollHeight;

  function updateDisplay() {
    if (!botDiv) return;
    let html = '';
    
    // 思考过程
    if (reasoningText || traceSteps.length > 0) {
      html += '<div class="thinking-box open">';
      html += '<div class="thinking-header" onclick="this.parentElement.classList.toggle(\'open\')">';
      html += '<span class="arrow">▶</span> 思考过程' + (answerStarted ? ' ✓' : '...') + '</div>';
      html += '<div class="thinking-body">';
      if (reasoningText) {
        html += '<div style="margin-bottom:8px;color:#4f46e5;line-height:1.6;">💭 ' + h(reasoningText) + '</div>';
      }
      for (const t of traceSteps) {
        let cls = 'trace-item ' + (t.step || '');
        let icon = '•';
        if (t.step === 'intent' || t.step === 'classify') icon = '🎯';
        else if (t.step === 'sql_generate' || t.step === 'sql_generated') icon = '📝';
        else if (t.step === 'sql_execute') icon = '📊';
        else if (t.step === 'kb_search' || t.step === 'kb_found') icon = '📚';
        else if (t.step === 'llm_format') icon = '🤖';
        else if (t.step === 'sql_skip' || t.step === 'kb_skip') icon = '⏭️';
        else if (t.step === 'done') icon = '✅';
        else if (t.step === 'sql_error' || t.step === 'sql_fallback' || t.step === 'kb_empty') icon = '⚠️';
        html += '<div class="' + cls + '"><span class="trace-icon">' + icon + '</span>' + h(t.content || '') + '</div>';
      }
      html += '</div></div>';
    }

    // 回答正文
    html += fullAnswer.replace(/\n/g, '<br>') || (answerStarted ? '' : '<span class="cursor"></span>');

    // 来源
    if (sources.length > 0) {
      html += '<div class="sources">📎 ' + sources.map(s => '<span class="src-tag">' + h(s) + '</span>').join('') + '</div>';
    }

    botDiv.innerHTML = html;
    chat.scrollTop = chat.scrollHeight;
  }

  try {
    const convParam = window.conversationId ? `&conv_id=${window.conversationId}` : '';
    const resp = await fetch(`/api/ask?q=${encodeURIComponent(q)}${convParam}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    let streamDone = false;
    while (true) {
      if (streamDone) break;
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop() || '';

      for (const part of parts) {
        const lines = part.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') { streamDone = true; break; }
          try {
            const p = JSON.parse(data);
            if (p.type === 'conv_id') {
              window.conversationId = p.id;
              loadConversations(); // 提问时立即刷新列表
            } else if (p.type === 'reasoning') {
              reasoningText = p.text;
            } else if (p.type === 'trace') {
              traceSteps.push(p);
            } else if (p.type === 'answer_chunk') {
              answerStarted = true;
              fullAnswer += p.token || '';
            } else if (p.type === 'answer_done') {
              sources = p.sources || [];
            }
          } catch(e) {}
        }
        if (streamDone) break;
      }
      updateDisplay();
    }

    // 从回答文本中清除来源行（如有，降级路径可能有）
    fullAnswer = fullAnswer.replace(/\n*> 来源: .+$/m, '').trim();
    updateDisplay();

  } catch(e) {
    botDiv.innerHTML = '❌ 请求失败: ' + h(e.message);
  } finally {
    setLoading(false);
    chat.scrollTop = chat.scrollHeight;
  }
  loadConversations();
}

// ── 会话管理 ──

async function loadConversations() {
  try {
    const resp = await fetch('/api/conversations');
    const data = await resp.json();
    const list = document.getElementById('convList');
    list.innerHTML = '';
    for (const c of data.data || []) {
      const item = document.createElement('div');
      item.className = 'conv-item' + (c.id === window.conversationId ? ' active' : '');
      item.setAttribute('data-cid', c.id);
      
      const title = document.createElement('div');
      title.className = 'ci-title';
      title.textContent = c.title || '(空)';
      
      const preview = document.createElement('div');
      preview.className = 'ci-preview';
      preview.textContent = c.preview || '';
      
      const meta = document.createElement('div');
      meta.className = 'ci-meta';
      const count = document.createElement('span');
      count.className = 'ci-count';
      count.textContent = c.count + ' 轮对话';
      meta.appendChild(count);
      
      const del = document.createElement('span');
      del.className = 'ci-del';
      del.textContent = '✕';
      del.onclick = (e) => { e.stopPropagation(); deleteConversation(c.id); };
      
      item.appendChild(title);
      if (c.preview) item.appendChild(preview);
      item.appendChild(meta);
      item.appendChild(del);
      item.onclick = () => switchConversation(c.id);
      list.appendChild(item);
    }
  } catch(e) {}
}

function newConversation() {
  window.conversationId = '';
  document.getElementById('chat').innerHTML = '';
  document.getElementById('chat').appendChild(document.getElementById('welcome'));
  document.getElementById('welcome').style.display = '';
  loadConversations();
  closeDrawers();
}

async function switchConversation(id) {
  setLoading(false);
  window.conversationId = id;
  // 加载历史消息
  try {
    const resp = await fetch(`/api/conversation?id=${id}`);
    const data = await resp.json();
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    for (const msg of data.messages || []) {
      if (msg.role === 'user') {
        const div = document.createElement('div');
        div.className = 'msg user';
        div.innerHTML = msg.content.replace(/\n/g, '<br>');
        chat.appendChild(div);
      } else {
        // 组装 bot 消息（含思考过程、来源）
        let html = '';
        // 思考过程
        if (msg.reasoning || (msg.traces && msg.traces.length > 0)) {
          html += '<div class="thinking-box open">';
          html += '<div class="thinking-header" onclick="this.parentElement.classList.toggle(\'open\')">';
          html += '<span class="arrow">▶</span> 思考过程 ✓</div>';
          html += '<div class="thinking-body">';
          if (msg.reasoning) {
            html += '<div style="margin-bottom:8px;color:#4f46e5;line-height:1.6;">💭 ' + h(msg.reasoning) + '</div>';
          }
          for (const t of msg.traces || []) {
            let cls = 'trace-item ' + (t.step || '');
            let icon = '•';
            if (t.step === 'intent' || t.step === 'classify') icon = '🎯';
            else if (t.step === 'sql_generate' || t.step === 'sql_generated') icon = '📝';
            else if (t.step === 'sql_execute') icon = '📊';
            else if (t.step === 'kb_search' || t.step === 'kb_found') icon = '📚';
            else if (t.step === 'llm_format') icon = '🤖';
            else if (t.step === 'sql_skip' || t.step === 'kb_skip') icon = '⏭️';
            else if (t.step === 'done') icon = '✅';
            else if (t.step === 'sql_error' || t.step === 'sql_fallback' || t.step === 'kb_empty') icon = '⚠️';
            html += '<div class="' + cls + '"><span class="trace-icon">' + icon + '</span>' + h(t.content || '') + '</div>';
          }
          html += '</div></div>';
        }
        // 回答内容
        html += msg.content.replace(/\n/g, '<br>');
        // 来源
        if (msg.sources && msg.sources.length > 0) {
          html += '<div class="sources">📎 ' + msg.sources.map(s => '<span class="src-tag">' + h(s) + '</span>').join('') + '</div>';
        }
        const div = document.createElement('div');
        div.className = 'msg bot';
        div.innerHTML = html;
        chat.appendChild(div);
      }
    }
    chat.scrollTop = chat.scrollHeight;
  } catch(e) {}
  loadConversations();
}

async function deleteConversation(id) {
  await fetch(`/api/conversation/delete?id=${id}`);
  if (window.conversationId === id) {
    window.conversationId = '';
    newConversation();
  } else {
    loadConversations();
  }
}

// ── 移动端抽屉控制 ──

function toggleDrawer(side) {
  const drawer = document.getElementById('drawer' + (side === 'left' ? 'Left' : 'Right'));
  const overlay = document.getElementById('drawerOverlay');
  const isOpen = drawer.classList.contains('open');
  closeDrawers();
  if (!isOpen) {
    drawer.classList.add('open');
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
}

function closeDrawers() {
  document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));
  document.getElementById('drawerOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

// 加载左侧抽屉内容（从 sidebar 复制）
function syncDrawerContent() {
  const sidebar = document.querySelector('.sidebar');
  const drawerBody = document.getElementById('drawerLeftBody');
  if (sidebar && drawerBody) {
    drawerBody.innerHTML = sidebar.innerHTML;
    // 绑定抽屉内 conv-list 的点击
    const list = drawerBody.querySelector('#convList');
    if (list) {
      // 移动端关闭抽屉后切换会话
      const orig = list.querySelectorAll('.conv-item');
      // 保留原有事件（由 loadConversations 重建）
    }
  }
  // 右侧抽屉的 conv-list 由 loadConversations 填充
}

// 覆写 loadConversations 以同步右侧抽屉
const _origLoadConv = loadConversations;
loadConversations = async function() {
  await _origLoadConv.call(this);
  // 同步右侧抽屉的会话列表
  const srcList = document.getElementById('convList');
  const dstList = document.getElementById('drawerRightBody');
  if (srcList && dstList) {
    dstList.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'conv-header';
    header.innerHTML = '<span>💬 会话记录</span><button class="conv-new" onclick="newConversation(); closeDrawers();">＋</button>';
    dstList.appendChild(header);
    const list = document.createElement('div');
    list.className = 'conv-list';
    list.id = 'drawerConvList';
    // 克隆所有会话项并绑定关闭抽屉事件
    for (const child of srcList.children) {
      const clone = child.cloneNode(true);
      const cid = clone.getAttribute('data-cid') || '';
      clone.onclick = (e) => {
        if (e.target.closest('.ci-del')) return;
        const id = clone.getAttribute('data-cid');
        if (id) { switchConversation(id); closeDrawers(); }
      };
      list.appendChild(clone);
    }
    dstList.appendChild(list);
  }
};

// 覆写 loadConversations 的项构建，添加 data-cid 属性
const _origBuildItem = window.buildConvItem || null;
// 初始化：同步 drawer 内容
window.addEventListener('load', function() {

  loadConversations();
});
